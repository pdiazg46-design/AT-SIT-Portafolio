  <body class="bg-slate-50 dark:bg-slate-950 select-none">
    <div id="root"></div>
    <script>
      // Registro del Service Worker para funcionamiento 100% Offline-First
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('SW Mi Mascota registrado:', reg.scope))
            .catch((err) => console.warn('SW error:', err));
        });
      }
    </script>
