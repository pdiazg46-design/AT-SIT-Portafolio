    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Safari / iOS Mobile Metas -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Mi Mascota" />

    <meta name="description" content="Hoja de Vida Médica y Carnet de Salud para Mascotas. 100% Offline y Soberano para el hogar." />

    <!-- Anti-zoom in inputs for iOS -->
    <style>input,select,textarea{font-size:16px!important}</style>
    <script type="module" crossorigin src="/mascota/assets/index-Cc9OhEYr.js"></script>
    <link rel="stylesheet" crossorigin href="/mascota/assets/index-M2f_EUbL.css">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 select-none">
    <div id="root"></div>
    <script>
      // Registro del Service Worker con protocolo de auto-actualización forzada silenciosa
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('SW Mi Mascota registrado:', reg.scope);
            
            // Forzar búsqueda de actualización cada vez que el usuario abre o vuelve a la app
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update().catch(() => {});
              }
            });

            // Chequeo periódico cada 15 minutos en segundo plano
            setInterval(() => {
              reg.update().catch(() => {});
            }, 15 * 60 * 1000);
          }).catch((err) => console.warn('SW error:', err));
        });

        // En cuanto el nuevo Service Worker toma el control, recargar instantáneamente sin avisos
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
